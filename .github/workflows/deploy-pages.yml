name: Publish site to gh-pages

on:
  push:
    branches: [claude/atlas-partner-site-upgrade-gqecba]
    # Só quando o SITE muda. Antes, todo commit do app disparava este job,
    # que reescreve a branch gh-pages — e cada reescrita fazia a Vercel criar
    # um deployment que morre em 1 segundo (a gh-pages não tem o app). Era um
    # deployment desperdiçado por commit, num plano com teto diário.
    paths:
      - index.html
      - 404.html
      - privacidade.html
      - .well-known/**
      - atlas.html
      - robots.txt
      - bi-analytics.html
      - data-engineering.html
      - alocacao.html
      - cases-de-sucesso.html
      - cases/**
      - parceiros/**
      - tools/cases.json
      - sitemap.xml
      - llms.txt
      - favicon.svg
      - favicon.ico
      - favicon-32.png
      - apple-touch-icon.png
      - CNAME
      - .publish-cname
      - media/**
      - .github/workflows/deploy-pages.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0

      - name: Assemble site
        run: |
          mkdir -p /tmp/site/media
          cp index.html 404.html privacidade.html atlas.html bi-analytics.html data-engineering.html alocacao.html cases-de-sucesso.html robots.txt sitemap.xml llms.txt favicon.svg favicon.ico favicon-32.png apple-touch-icon.png /tmp/site/
          mkdir -p /tmp/site/.well-known && cp .well-known/security.txt /tmp/site/.well-known/
          mkdir -p /tmp/site/cases && cp cases/*.html /tmp/site/cases/
          mkdir -p /tmp/site/parceiros && cp parceiros/*.html /tmp/site/parceiros/
          cp -r media/. /tmp/site/media/
          # O arquivo CNAME é adicionado ao gh-pages apenas quando o DNS do
          # domínio estiver apontado (ele define o custom domain no Pages).
          if [ -f .publish-cname ]; then cp CNAME /tmp/site/CNAME; fi
          touch /tmp/site/.nojekyll

      - name: Push to gh-pages
        run: |
          cd /tmp/site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish site from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
