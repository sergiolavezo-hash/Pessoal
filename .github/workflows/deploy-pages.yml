name: Publish site to gh-pages

on:
  push:
    branches: [claude/atlas-partner-site-upgrade-gqecba]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Assemble site
        run: |
          mkdir -p /tmp/site/media
          cp index.html insight.html robots.txt sitemap.xml llms.txt favicon.svg favicon.ico favicon-32.png apple-touch-icon.png /tmp/site/
          cp -r media/. /tmp/site/media/
          # O arquivo CNAME é adicionado ao gh-pages apenas quando o DNS do
          # domínio estiver apontado (ele define o custom domain no Pages).
          if [ -f .publish-cname ]; then cp CNAME /tmp/site/CNAME; fi
          touch /tmp/site/.nojekyll

      - name: Push to gh-pages
        run: |
          cd /tmp/site
          git init -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Publish site from ${GITHUB_SHA}"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
